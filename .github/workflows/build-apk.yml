name: Build Termux AI APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: false
        default: 'debug'

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 11076708
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.3.13750724 cmake;3.22.1'

    - name: Create local.properties & prepare gradlew
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        echo "ndk.dir=$ANDROID_NDK_ROOT" >> local.properties
        chmod +x gradlew

    - name: Run AI Code Review Agent
      run: python3 tools/review_agent.py

    - name: Download Termux Bootstraps
      run: |
        echo "Downloading Termux bootstrap rootfs packages..."
        ./gradlew downloadBootstraps --stacktrace

    - name: Build with Gradle (Debug)
      if: github.event.inputs.build_type == 'debug' || github.event_name != 'workflow_dispatch'
      run: |
        echo "Building debug APK..."
        ./gradlew assembleDebug --stacktrace

    - name: Build with Gradle (Release)
      if: github.event.inputs.build_type == 'release'
      run: |
        echo "Building release APK..."
        ./gradlew assembleRelease --stacktrace

    - name: Upload APK artifact (Debug)
      if: success() && (github.event.inputs.build_type == 'debug' || github.event_name != 'workflow_dispatch')
      uses: actions/upload-artifact@v4
      with:
        name: termux-ai-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload APK artifact (Release)  
      if: success() && github.event.inputs.build_type == 'release'
      uses: actions/upload-artifact@v4
      with:
        name: termux-ai-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 90

    - name: Create Release
      if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v0.1.0-build-${{ github.run_number }}
        name: Termux AI v0.1.0 Build ${{ github.run_number }}
        body: |
          This is an automatically generated build for Termux+ (formerly Termux AI).

          Key features of this release:
          - **Plus Features Toggle System**: Granular control over experimental features.
          - **Modular Plugin System**: Runtime management of terminal extensions.
          - **AI Capabilities**: Deep integration with Claude and Gemini.
          - **Material You (M3)**: Dynamic theming that adapts to your wallpaper.
          - **Enhanced Terminal UI**: Multi-tab support and professional PTY emulation.

          Installation:
          1. Download the APK from the assets below.
          2. Enable "Install from unknown sources" in your Android settings if prompted.
          3. Install the APK and enjoy!

          Built automatically with GitHub Actions 🚀
        files: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/release/*.apk
        draft: false
        prerelease: false
        
    - name: Build Summary
      if: always()
      run: |
        echo "## 📱 Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
          APK_SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
          echo "✅ **Debug APK built successfully!**" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Size: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- 📱 Package: com.termux.ai" >> $GITHUB_STEP_SUMMARY
          echo "- 🎯 Target: Android 7.0+ (API 24+)" >> $GITHUB_STEP_SUMMARY
        elif [ -f app/build/outputs/apk/release/app-release.apk ] || [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
          echo "✅ **Release APK built successfully!**" >> $GITHUB_STEP_SUMMARY
          echo "- 📱 Package: com.termux.ai" >> $GITHUB_STEP_SUMMARY
          echo "- 🎯 Target: Android 7.0+ (API 24+)" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Build failed**" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for error details." >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 🚀 Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "1. Download the APK from the Artifacts section" >> $GITHUB_STEP_SUMMARY
        echo "2. Install on your Android device" >> $GITHUB_STEP_SUMMARY  
        echo "3. Install Claude Code CLI: \`npm install -g @anthropic/claude-code\`" >> $GITHUB_STEP_SUMMARY
        echo "4. Start coding with AI assistance!" >> $GITHUB_STEP_SUMMARY