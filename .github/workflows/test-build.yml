name: Test Build (Quick)

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 11076708
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.3.13750724 cmake;3.22.1'

    - name: Basic setup
      run: |
        chmod +x gradlew
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        echo "ndk.dir=$ANDROID_NDK_ROOT" >> local.properties

    - name: Test compilation
      run: |
        ./gradlew compileDebugJavaWithJavac --continue

    - name: Report issues
      if: always()
      run: |
        echo "## 🔍 Quick Build Test Results" >> $GITHUB_STEP_SUMMARY
        if [ $? -eq 0 ]; then
          echo "✅ Java compilation looks good" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Java compilation issues detected" >> $GITHUB_STEP_SUMMARY
        fi