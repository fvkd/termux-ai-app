name: Android Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 11076708
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.3.13750724 cmake;3.22.1'

    - name: Prepare build environment
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        echo "ndk.dir=$ANDROID_NDK_ROOT" >> local.properties
        chmod +x gradlew

    - name: Run AI Code Review Agent
      run: python3 tools/review_agent.py

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: termux-ai-debug-apk-direct
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7

    - name: List build output
      if: always()
      run: |
        echo "=== Build Output Directory ==="
        find app/build/outputs -name "*.apk" -type f || echo "No APK files found"